name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Passo próprio (e não só embutido no build) para que a corrupção de
      # asset apareça como um passo vermelho e nomeado no log da Action, em vez
      # de escondida no meio da saída do build.
      #
      # Motivo de existir: os GLB já foram corrompidos por um
      # localizar-e-substituir global que alcançou os binários. O jogo não
      # quebrou — degradou em silêncio para a geometria de reserva, e foi ao ar
      # assim. Aqui isso vira falha de deploy.
      - name: Validate binary assets
        run: npm run validate:assets

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
